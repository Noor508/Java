	}
		
		

	return true;

}


function validateEmail(email) {
  var atIndex = email.indexOf('@');
  var dotIndex = email.lastIndexOf('.');

  if (atIndex === -1 || atIndex === 0 || atIndex === email.length - 1) {
    return false;
  }

 
  if (dotIndex === -1 || dotIndex === 0 || dotIndex === email.length - 1) {
    return false;
  }

 
  if (dotIndex < atIndex) {
    return false;
  }

  return true;
}
function number(event)

		   return true;
		else
		   return false;
	}
